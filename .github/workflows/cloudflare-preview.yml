name: Cloudflare Preview

# Feature-branch previews only. Never deploys main, production, DNS or custom domains.
on:
  push:
    branches:
      - feature/portfolio-2026-refresh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HRK_PROJECT: hrk-design-portfolio-preview
      CIJD_PROJECT: cijd-design-portfolio-preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build both brands from the shared source
        run: |
          node scripts/check-data.mjs
          npx vite build --base=/ --outDir dist-preview
          VITE_BRAND=cijd npx vite build --base=/ --outDir dist-cijd-preview
          PORTFOLIO_HRK_BUILD=dist-preview PORTFOLIO_CIJD_BUILD=dist-cijd-preview npm run check:builds

      - name: Require stable Cloudflare Pages credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error title=Cloudflare Preview credentials missing::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as GitHub Actions secrets. Temporary Workers previews cannot serve preserved artwork originals larger than the Workers asset limit."
          exit 1

      - name: Deploy HRK branch preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project list | grep -q "$HRK_PROJECT" \
            || npx --yes wrangler@4 pages project create "$HRK_PROJECT" --production-branch=preview-production
          npx --yes wrangler@4 pages deploy dist-preview \
            --project-name="$HRK_PROJECT" --branch=portfolio-2026-refresh \
            --commit-hash="$GITHUB_SHA" | tee deploy-hrk.log

      - name: Deploy CIJD branch preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx --yes wrangler@4 pages project list | grep -q "$CIJD_PROJECT" \
            || npx --yes wrangler@4 pages project create "$CIJD_PROJECT" --production-branch=preview-production
          npx --yes wrangler@4 pages deploy dist-cijd-preview \
            --project-name="$CIJD_PROJECT" --branch=portfolio-2026-refresh \
            --commit-hash="$GITHUB_SHA" | tee deploy-cijd.log

      - name: Publish and verify preview URLs
        id: urls
        if: always()
        run: |
          HRK_URL=$(grep -oE 'https://[A-Za-z0-9._/-]+\.(pages\.dev|workers\.dev)[A-Za-z0-9._/-]*' deploy-hrk.log | tail -1 || true)
          CIJD_URL=$(grep -oE 'https://[A-Za-z0-9._/-]+\.(pages\.dev|workers\.dev)[A-Za-z0-9._/-]*' deploy-cijd.log | tail -1 || true)
          echo "hrk_url=$HRK_URL" >> "$GITHUB_OUTPUT"
          echo "cijd_url=$CIJD_URL" >> "$GITHUB_OUTPUT"
          {
            echo "### Portfolio previews"
            echo ""
            echo "Commit: $GITHUB_SHA"
            echo ""
            echo "HRK: ${HRK_URL:-not found — see deploy-hrk.log}"
          echo ""
          echo "CIJD: ${CIJD_URL:-not found — see deploy-cijd.log}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install browser for live checks
        if: steps.urls.outputs.hrk_url != '' || steps.urls.outputs.cijd_url != ''
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium

      - name: Verify HRK preview
        if: steps.urls.outputs.hrk_url != ''
        env:
          PREVIEW_URL: ${{ steps.urls.outputs.hrk_url }}
        run: node scripts/verify-preview.mjs

      - name: Verify CIJD preview
        if: steps.urls.outputs.cijd_url != ''
        env:
          PREVIEW_URL: ${{ steps.urls.outputs.cijd_url }}
          EXPECTED_BRAND: cijd
        run: node scripts/verify-preview.mjs
